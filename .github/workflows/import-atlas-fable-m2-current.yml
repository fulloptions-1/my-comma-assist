name: Import current Atlas Fable snapshot

on:
  push:
    branches:
      - atlas-fable-m2-current
    paths:
      - atlas-fable-m2-current-snapshot.zip
      - .github/workflows/import-atlas-fable-m2-current.yml
  pull_request:
    branches:
      - master
    types: [opened, synchronize, reopened]
    paths:
      - atlas-fable-m2-current-snapshot.zip
      - .github/workflows/import-atlas-fable-m2-current.yml

permissions:
  contents: write

concurrency:
  group: atlas-fable-m2-current-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out snapshot branch
        uses: actions/checkout@v4
        with:
          ref: atlas-fable-m2-current
          fetch-depth: 0

      - name: Verify and publish extracted source
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import shutil
          import zipfile
          from pathlib import Path

          root = Path.cwd().resolve()
          archive = root / "atlas-fable-m2-current-snapshot.zip"
          expected = "31bab6e16af95b35c1ad73be9b5f72303a740e12740b2cc4aa2d5d4bcd67ba24"
          target = root / "snapshot" / "tree"
          manifest = root / "snapshot" / "MANIFEST.sha256"

          if not archive.is_file():
              raise SystemExit(f"Missing {archive.name}")

          actual = hashlib.sha256(archive.read_bytes()).hexdigest()
          if actual != expected:
              raise SystemExit(f"SHA-256 mismatch: expected {expected}, got {actual}")

          if target.exists():
              shutil.rmtree(target)
          target.mkdir(parents=True)

          with zipfile.ZipFile(archive) as zf:
              for member in zf.infolist():
                  destination = (target / member.filename).resolve()
                  if target not in destination.parents and destination != target:
                      raise SystemExit(f"Unsafe ZIP path: {member.filename}")
              zf.extractall(target)

          rows = []
          for path in sorted(p for p in target.rglob("*") if p.is_file()):
              relative = path.relative_to(target).as_posix()
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              rows.append(f"{digest}  {relative}")
          manifest.write_text("\n".join(rows) + "\n", encoding="utf-8")

          print(f"Verified archive {actual}")
          print(f"Published {len(rows)} files under snapshot/tree")
          PY

      - name: Commit extracted source
        shell: bash
        run: |
          git config user.name "atlas-snapshot-bot"
          git config user.email "atlas-snapshot-bot@users.noreply.github.com"
          git add snapshot/tree snapshot/MANIFEST.sha256
          if git diff --cached --quiet; then
            echo "Extracted snapshot is already current"
            exit 0
          fi
          git commit -m "Publish extracted current Atlas source for Fable M1.6 and M2"
          git push origin HEAD:atlas-fable-m2-current

      - name: Verify published snapshot
        continue-on-error: true
        shell: bash
        working-directory: snapshot/tree
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pytest -q
          python -m compileall -q atlas tests scripts
          node --check atlas/static/app.js
          python scripts/check_app_import.py
